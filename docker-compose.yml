services:
  backend:
    build:
      context: ./backend
    environment:
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /app/backend/storage
      DATABASE_URL: sqlite:////app/backend/storage/vigil_recorder.sqlite3
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/backend/storage

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
